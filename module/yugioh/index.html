<!DOCTYPE HTML>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/a3f0394999.js" crossorigin="anonymous"></script>
    <script src="../../js/settings.js"></script>
    <link rel="icon" type="image/x-icon" href="../../asset/icon.png">
    <title>HaiseB - Combo Breakdown</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="./main.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg site-navbar">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand" href="../../index.html">HaiseB</a>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item" id="li-home">
                        <a class="nav-link" href="../../index.html"><i
                                class="fa-solid fa-house"></i>&nbsp;&nbsp;Accueil</a>
                    </li>
                    <li class="nav-item" id="li-portfolio">
                        <a class="nav-link" href="../portfolio/index.html"><i class="fa-solid fa-user"></i>&nbsp;&nbsp;Portfolio</a>
                    </li>
                    <li class="nav-item" id="li-yugioh">
                        <a class="nav-link active" aria-current="page" href="./index.html"><i
                                class="fa-solid fa-dragon"></i>&nbsp;&nbsp;Yu-Gi-Oh!</a>
                    </li>
                </ul>
                <div class="navbar-actions d-flex align-items-center justify-content-around">
                    <a class="nav-icon-button" data-bs-toggle="offcanvas" href="#offcanvasSettings" role="button"
                        aria-controls="offcanvasSettings" aria-label="Paramètres">
                        <img src="https://i.ibb.co/nnzfDhd/Benjamin.jpg" class="rounded-circle"
                            alt="profil picture" size="36" height="36" width="36" id="profil-picture" />
                    </a>
                    <form class="nav-search d-flex align-items-center" role="search" data-root-prefix="../..">
                        <input class="form-control me-2" type="search" placeholder="Recherche" aria-label="Search">
                        <button class="btn" type="submit">Rechercher</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasSettings" aria-labelledby="offcanvasSettingsLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasSettingsLabel">
                <img src="https://i.ibb.co/nnzfDhd/Benjamin.jpg" class="rounded-circle me-2" alt="profil picture"
                    size="36" height="36" width="36" id="offcanvas-profil-picture" />
                <span class="fs-4">Paramètres</span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <form id="settingsForm">
                <h6>Yu-Gi-Oh</h6>
                <div class="mb-3">
                    <label for="ygoCardVisualMode" class="form-label">Affichage des cartes</label>
                    <select class="form-select" id="ygoCardVisualMode">
                        <option value="emoji">Emoji (par défaut)</option>
                        <option value="image">Image complète</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success" data-bs-dismiss="offcanvas">Enregistrer les modifications</button>
            </form>
        </div>
    </div>

    <div id="app" class="ygo-app"></div>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
